name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: SwiftLint (strict)
        run: swiftlint lint --strict --quiet
      - name: Ruff (syntax errors and unused names)
        run: pipx run ruff check scripts
      - name: Shell script syntax
        run: |
          for script in scripts/*.sh; do zsh -n "$script"; done
          for script in $(ls plugins/*/scripts/*.sh 2>/dev/null); do sh -n "$script"; done
      - name: Documentation links
        run: python3 scripts/check-docs.py

  build-test:
    name: Build and test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tool versions
        run: |
          swift --version
          python3 --version
      - name: Glyph pipeline dependencies
        run: |
          brew install potrace
          python3 -m venv .venv
          # The requirements file points at a local fonttools checkout; PyPI's fonttools works too.
          grep -v '^-e' scripts/glyphs/requirements.txt > "$RUNNER_TEMP/requirements.txt"
          .venv/bin/pip install --quiet -r "$RUNNER_TEMP/requirements.txt" "fonttools>=4.66"
      - name: Glyph pipeline is reproducible
        run: make glyphs-verify
      - name: Build the app (no warnings in our sources)
        run: |
          set -o pipefail
          make app 2>&1 | tee build.log
          if grep -E "Sources/Dreams.*warning:" build.log; then echo "::error::Compiler warnings in Sources/Dreams"; exit 1; fi
      - name: Unit checks
        run: make test-unit
      - name: Strings, hooks, uninstall, plugins
        run: |
          python3 scripts/test-localization.py
          python3 scripts/test-hooks-install.py dist/Dreams.app/Contents/MacOS/Dreams
          python3 scripts/test-uninstall.py
          python3 scripts/test-plugins.py
      - name: "MCP smoke and Metal rendering (best effort, hosted runners may have no GPU)"
        continue-on-error: true
        run: |
          python3 scripts/smoke.py
          .venv/bin/python scripts/test-transparent.py
