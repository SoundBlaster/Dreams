apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.settings.host
  title: NativeSettingsHost
  version: 0.1.0-draft.2
  status: draft
intent:
  summary: Let an opted-in macOS user change the same Dreams settings through native SwiftUI forms while retaining legacy access.
scope:
  boundedContext: desktop_settings_presentation
  includes:
  - Launch routing, native sidebar/forms, shared controller bindings, error presentation and cleanup.
  - Existing rain, display and hook operations invoked through their current owners.
  excludes:
  - Embedded Metal preview, whole-window glass, full shortcut-recording migration and default-on rollout.
  - Overlay algorithms, hook installation semantics, renderer internals, tvOS and glyph editing.
provides:
  capabilities:
  - id: dreams.settings.host
    role: primary
    summary: Opt-in native settings window using production state and an explicit legacy fallback.
requires:
  capabilities:
  - id: dreams.settings.ui
    summary: The local DreamsSettingsUI library supplies SettingsSliderRow with host-owned bindings, formatting and identifiers.
  - id: platform.apple.swiftui
    summary: macOS 15+ supplies the native navigation, forms and controls.
interfaces:
  inbound:
  - id: launch
    kind: cli
    summary: Route the interactive settings action according to launch arguments.
    operations:
    - name: Dreams --native-settings
      inputs:
      - name: arguments
        type: Process launch arguments; --legacy-settings overrides --native-settings
      outputs:
      - name: window
        type: SwiftUI settings when opted in, otherwise the legacy AppKit window
  - id: settings_operations
    kind: library
    summary: Read and write the shared production settings controller through native bindings.
    operations:
    - name: NativeSettingsModel bindings/actions
      inputs:
      - name: owner
        type: Retained MainActor SettingsPageController and its DreamsController
      - name: edits
        type: Scalar/color/boolean bindings, display choices, start/stop/reset or hook action
      outputs:
      - name: actual_state
        type: Controller values and notification-driven UI refresh; existing persistent keys and renderer propagation
  outbound: []
constraints:
- id: default_off
  level: MUST
  statement: Absence of --native-settings selects the legacy window. --legacy-settings wins when both launch flags are present; there is no saved enablement key.
- id: native_controls
  level: MUST
  statement: Use system SwiftUI NavigationSplitView, sidebar List, grouped Form, Section, Slider, Toggle, Picker, ColorPicker, buttons and alerts. The app links only the composition library, not the catalog executable.
- id: one_settings_owner
  level: MUST
  statement: Native bindings use the existing DreamsController values and operations without independently persisting a second model. Controller settings/display notifications refresh the native adapter and an existing legacy window.
- id: range_units
  level: MUST
  statement: Native scalar setters reject nonfinite values and use current production ranges; manual columns and fade round to whole values. Zero columns retains automatic mode and run time accepts only existing presets.
- id: operation_semantics
  level: MUST
  statement: Background changes retain separate color/glow profiles, displays use existing reconciliation and hook actions use the existing installer. Present errors against the actual controller state; do not promise rollback or atomic reset beyond that controller.
- id: explicit_legacy_access
  level: MUST
  statement: General and Advanced provide access to the legacy window for shortcut recording and all previous controls. Both presentations use the same settings owner.
- id: lifetime
  level: MUST
  statement: Reuse the native window and preserve its navigation state when reopening. Both settings presentations share one activity timer; terminal cleanup invalidates it and removes retained notification observers.
- id: overlay_exit
  level: MUST
  statement: Opening either settings window retains stopForReopen. The native NSWindow forwards its existing Escape path to the controller; stop shortcut registration remains owned by SettingsPageController.
- id: preview_limit
  level: MUST
  statement: This host implements standard settings surfaces, without embedded rain or whole-window glass. Changing settings does not itself launch a fullscreen overlay.
effects:
  sideEffects:
  - id: saved_settings
    kind: state_mutation
    summary: Explicit edits use existing preference writes and update live renderers; display/background operations retain their prior possible failure behavior.
  - id: lifecycle
    kind: state_mutation
    summary: Explicit start/stop, window reopen, reset and hook buttons delegate to existing production operations.
evidence:
- id: source
  kind: source
  path: evidence/2026-10-14/source/Sources/Dreams/pages/settings/model/NativeSettingsModel.swift
  supports:
  - constraints
- id: tests
  kind: test
  path: evidence/2026-10-14/source/Tests/DreamsTests/NativeSettingsTests.swift
  supports:
  - constraints.default_off
  - constraints.one_settings_owner
  - constraints.range_units
  - constraints.lifetime
- id: validation
  kind: test
  path: validation/2026-10-14-ui-border/README.md
  supports:
  - constraints
- id: local_ui_dependency
  kind: source
  path: evidence/2026-10-14-ui-border/source/Packages/DreamsSettingsUI/Sources/DreamsSettingsUI/SettingsSliderRow.swift
  supports:
  - constraints.native_controls
provenance:
  sourceConfidence:
    extraction: high
  notes:
  - Default-off feature routing, native controls and preservation of previous settings are user product requirements; newly recovered contracts remain descriptive drafts.
  - Source reading and local tests are separate from native keyboard/VoiceOver/compositor acceptance. Screener 0.2.0 hierarchy frames do not establish accurate glass or sidebar selection pixels. The optional test-only ScreenCaptureKit backend requires existing authorization, names the current test window/owner and provides no desktop or hierarchy fallback.
