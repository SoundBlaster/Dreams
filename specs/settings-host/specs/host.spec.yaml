- id: source
  kind: source
  path: evidence/2026-10-21-appearance/source/Sources/Dreams/pages/settings/model/NativeSettingsModel.swift
  supports:
  - constraints
- id: tests
  kind: test
  path: evidence/2026-10-24-native-default/source/Tests/DreamsTests/NativeSettingsTests.swift
  supports:
  - constraints.default_off
  - constraints.one_settings_owner
  - constraints.range_units
  - constraints.lifetime
- id: validation
  kind: test
  path: validation/2026-10-24-native-default/README.md
  supports:
  - constraints
- id: appearance_validation
  kind: test
  path: validation/2026-10-21-appearance/README.md
  supports:
  - constraints.quick_appearance
- id: local_ui_dependency
  kind: source
  path: evidence/2026-10-20-accessibility/source/Packages/DreamsSettingsUI/Sources/DreamsSettingsUI/SettingsSliderRow.swift
  supports:
  - constraints.native_controls
- id: preview_tests
  kind: test
  path: evidence/2026-10-15-materials/source/Tests/DreamsTests/NativePreviewTests.swift
  supports:
  - constraints.independent_preview
  - constraints.preview_scale
  - constraints.preview_lifetime
  - constraints.preview_playback
- id: shortcut_tests
  kind: test
  path: evidence/2026-10-15-shortcut-retry/source/Tests/DreamsTests/StopShortcutRecorderTests.swift
  supports:
  - constraints.shortcut_recording
  - constraints.overlay_exit
provenance:
  sourceConfidence:
    extraction: high
  notes:
  - The owner explicitly requested native settings by default on 2026-10-24, superseding the former opt-in rollout requirement. The historical default_off claim identifier is preserved across this intentional versioned behavior change; earlier evidence remains on its original source. Native controls and preservation of previous settings remain requirements; recovered contracts stay descriptive drafts.
  - Source reading and local tests are separate from native keyboard/VoiceOver/compositor acceptance. Screener 0.2.0 hierarchy frames do not establish accurate glass or sidebar selection pixels. The optional test-only ScreenCaptureKit backend requires existing authorization, names the current test window/owner and provides no desktop or hierarchy fallback.
