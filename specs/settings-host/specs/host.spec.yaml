apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.settings.host
  title: NativeSettingsHost
  version: 0.1.0-draft.22
  status: draft
intent:
  summary: Let macOS users change Dreams settings through native SwiftUI forms by default while retaining explicit legacy access.
scope:
  boundedContext: desktop_settings_presentation
  includes:
  - Launch routing, native sidebar/forms, shared controller bindings, error presentation and cleanup.
  - Existing rain, display and hook operations invoked through their current owners.
  - Window-local Metal backdrop using production renderer and shared tuning, system material forms and an uncovered rain region.
  excludes:
  - Desktop-through-window transparency.
  - Overlay algorithms, hook installation semantics, renderer internals, tvOS and glyph editing.
provides:
  capabilities:
  - id: dreams.settings.host
    role: primary
    summary: Default native settings window using production state and an explicit legacy fallback.
requires:
  capabilities:
  - id: dreams.settings.ui
    summary: The local DreamsSettingsUI library supplies SettingsSliderRow and SettingsMaterialPanel with host-owned bindings, formatting and identifiers.
  - id: platform.apple.metal_renderer
    summary: The production RainRenderer supplies the same glyph and rain pipeline to a separate MTKView session.
  - id: platform.apple.swiftui
    summary: macOS 15+ supplies the native navigation, forms and controls.
interfaces:
  inbound:
  - id: launch
    kind: cli
    summary: Route the interactive settings action according to launch arguments.
    operations:
    - name: Dreams
      inputs:
      - name: arguments
        type: Process launch arguments; --legacy-settings overrides the native default and compatible --native-settings alias
      outputs:
      - name: window
        type: SwiftUI settings by default, or the legacy AppKit window when --legacy-settings is present
  - id: settings_operations
    kind: library
    summary: Read and write the shared production settings controller through native bindings.
    operations:
    - name: NativeSettingsModel bindings/actions
      inputs:
      - name: owner
        type: Retained MainActor SettingsPageController and its DreamsController
      - name: edits
        type: Scalar/color/boolean bindings, display choices, start/stop/reset, shortcut recording or hook action
      outputs:
      - name: actual_state
        type: Controller values and notification-driven UI refresh; existing persistent keys and renderer propagation
  outbound: []
constraints:
- id: default_off
  level: MUST
  statement: Native settings are selected without launch arguments. --legacy-settings selects the legacy window and wins regardless of --native-settings or argument order; --native-settings remains a compatible explicit native alias. There is no saved enablement key. The stable default_off identifier is retained for historical traceability; this version intentionally supersedes its previous opt-in requirement at the owner's request.
- id: native_controls
  level: MUST
  statement: Use system SwiftUI NavigationSplitView, sidebar List, grouped Form, Section, Slider, Toggle, Picker, ColorPicker, buttons and alerts. The app links only the composition library, not the catalog executable. The native host hides the window toolbar and title with system APIs while retaining titled-window controls, a full-size content view and native window dragging. Section titles live inside settings panels. The sidebar has a noninteractive identity header with the current application icon, Dreams title and Agentic Screensaver subtitle above the native section list. Its text uses semantic styles and a combined accessibility element; its background supports native window dragging. The sidebar remains visible in a balanced NavigationSplitView with constant all-column visibility. There is no hide/show button, app-owned hide shortcut or collapsed-detail recovery layout. Native controls expose the existing localized parameter help. General shares the context-sensitive duration/exit explanation with legacy and gives Start the system Return default action. Display rows share built-in/main/agent-workspace suffixes and tooltips with legacy. App build/release and native trace helpers use the active compiler SDK and matching linked SDK metadata, preserving the package deployment target.
- id: one_settings_owner
  level: MUST
  statement: Native bindings use the existing DreamsController values and operations without independently persisting a second model. Controller settings/display notifications refresh the native adapter and an existing legacy window.
- id: range_units
  level: MUST
  statement: Native scalar setters reject nonfinite values and use current production ranges; manual columns and fade round to whole values. Zero columns retains automatic mode and run time accepts only existing presets.
- id: operation_semantics
  level: MUST
  statement: Background changes retain separate color/glow profiles, displays use existing reconciliation and hook actions use the existing installer. After reset success or failure, attempt to register the current controller stop shortcut and synchronize legacy controls before refreshing the actual state. Present reset errors and existing shortcut conflicts; Carbon registration remains fallible. Do not promise rollback or atomic reset beyond that controller.
- id: quick_appearance
  level: MUST
  statement: Native Appearance offers Classic, Dimmed and Monochrome recipes and eight named quick colors through native Toggles and Buttons. Recipes set only rain color, active-profile glow, shared brightness spread and pulse; grid, motion, glyphs, activity and agent settings are retained. Classic uses the existing active-background defaults; Dimmed reduces that green and glow; Monochrome uses neutral RGB. Color and glow retain the existing opaque/transparent storage split; spread and pulse stay shared. Quick colors change only active rain color. Selection is derived from actual color/glow/spread/pulse with numeric conversion tolerance, never a separately saved preset name. Unmatched manual values show Custom and remain editable with the native ColorPicker/sliders. Quick colors expose localized names and selected state; preview/window tint update through the existing owner notifications.
- id: explicit_legacy_access
  level: MUST
  statement: Advanced provides access to the legacy window and all previous controls. General records and resets the stop shortcut directly. Both presentations use the same settings owner.
- id: lifetime
  level: MUST
  statement: Reuse the native window and preserve its navigation state when reopening. Both settings presentations share one activity timer; terminal cleanup invalidates it and removes retained notification observers.
- id: overlay_exit
  level: MUST
  statement: Opening either settings window retains stopForReopen. Outside shortcut recording the native NSWindow forwards its existing Escape path to the controller; stop shortcut registration remains owned by SettingsPageController.
- id: shortcut_recording
  level: MUST
  statement: Both settings presentations share one temporary window-scoped recorder. Accept a combination only with Control, Option or Command; invalid plain/Shift-only keys keep recording with guidance. Consume Escape to cancel without invoking the window exit path. Cancel on a second activation, native section change, recording-window close/key loss, application deactivation/hide or terminal cleanup. Unrelated-window keys pass through. Retrying after a failed startup install restores both the Carbon handler and key registration. Successful registration updates the existing preference/menu/UI; failed registration retains the saved value and displays the error in both presentations. Carbon rollback remains fallible under dreams.overlay.exit.
- id: preview_limit
  level: MUST
  statement: This host embeds a separate live rain backdrop under system settings surfaces with an uncovered viewing region. Preview playback and setting edits do not themselves launch a fullscreen overlay.
- id: independent_preview
  level: MUST
  statement: Preview owns a separate renderer and clock, uses controller tuning and recreates its renderer for background or glyph-set changes. It does not own preferences or the fullscreen overlay. One Metal surface spans the detail behind the forms; the uncovered region sits above the form in narrow layouts and beside it at detail widths of at least 700 points. In wide layouts forms are capped at 480 points, the preview reserves at least 240 points and receives additional width, with 16-point spacing and outer insets. Changing layout must retain that surface.
- id: preview_scale
  level: MUST
  statement: Preview preserves the glyph size and grid spacing of a fullscreen renderer on the hosting display, using screen dimensions converted to the current view backing pixels. Its drawable crops the screen-sized viewport at the top-left; resizing changes the visible portion instead of fitting all columns. Display/backing changes refresh even paused previews.
- id: material_composition
  level: MUST
  statement: Setting names in content rows use semantic monochrome SF Symbols in a shared 24-point decorative slot with wrapping titles. Icons are hidden from accessibility; native controls retain localized labels, values and identifiers. Forms remain native grouped forms and follow the system color scheme. Rain is the composition pilot, with a scrollable localized title/description, three native groups and an open preview region without an enclosing outline. All sections use the shared native regular Liquid Glass panel on macOS 26+, with regular material on macOS 15, clipped to 16-point rounded corners. The active rain color supplies the window control tint and selected sidebar icon tint, updating with color edits and transparent/opaque profile changes. Inactive sidebar icons use the semantic primary tint with monochrome symbols. Native Label rows use body text, uniformly allocated icon space and native row insets/content minimum height for a more spacious list. Native selection rendering remains platform-owned; no independent accent preference or custom selection drawing is added. Reduce Transparency or increased contrast substitutes an opaque semantic background. macOS 26 may extend the backdrop beneath native navigation with the system background extension and uses a large prominent glass playback button inheriting the active rain tint; macOS 15 uses the standard material and prominent bordered button. The clear region exposes the same backdrop, not another renderer or a scaled duplicate. The preview omits its heading panel and places only the playback control at the trailing top edge. Its icon content has a fixed 64 by 28 point frame, with large native control size and stable width across Play/Pause. The help panel fills the available pane width. Preview chrome geometry remains the same across sections; the clear region has no enclosing outline or section-dependent inset.
- id: preview_lifetime
  level: MUST
  statement: Only the currently bound visible surface may render. Hide, minimize, close and full occlusion pause and release the preview renderer; stale surface callbacks must not stop its replacement. Reopening uses current settings.
- id: preview_playback
  level: MUST
  statement: Preview has a local pause/play control and native failure/Retry state. Reduce Motion initially pauses animation and enabling it pauses playback; disabling it never auto-resumes, while explicit Play is allowed.
effects:
  sideEffects:
  - id: saved_settings
    kind: state_mutation
    summary: Explicit edits use existing preference writes and update live renderers; display/background operations retain their prior possible failure behavior.
  - id: lifecycle
    kind: state_mutation
    summary: Explicit start/stop, window reopen, reset and hook buttons delegate to existing production operations.
