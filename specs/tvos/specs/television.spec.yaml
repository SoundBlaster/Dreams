apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.tv.rain
  title: TelevisionRainAndClock
  version: 0.1.0-draft.6
  status: draft
intent:
  summary: Give Apple TV viewers the desktop rain's motion and appearance controls without agent or desktop-window integrations, preserving the optional TV clock.
scope:
  boundedContext: television_rain
  includes:
  - Foreground rain, optional whole-glyph clock, persistent remote settings and live preview.
  - Shared simulation/pulse/presets/shader and bundled restored/classic glyph atlases.
  excludes:
  - Agent words/activity, hooks, MCP, transparent desktop overlays, capture hiding, display management, global hotkeys and overlay duration.
  - Replacement of the tvOS system screensaver, background execution, film-fidelity and physical TV performance acceptance.
provides:
  capabilities:
  - id: dreams.tv.rain
    role: primary
    summary: Present adjustable stationary rain with optional clock and remote-accessible saved tuning.
requires:
  capabilities:
  - id: platform.apple.tvos
    summary: tvOS18+ scene lifecycle, UIKit, CoreText, focus engine and SwiftUI native controls.
  - id: platform.apple.metal_renderer
    summary: A working Metal device, command queue and bundled Rain.metal runtime shader compilation.
interfaces:
  inbound:
  - id: launch_and_remote
    kind: library
    summary: Open the foreground rain and adjust local settings with Siri Remote.
    operations:
    - name: AppRoot/SettingsPage
      inputs:
      - name: preferences_and_commands
        type: TV UserDefaults; Select/PlayPause/Back and directional adjustment
      outputs:
      - name: presentation
        type: one Metal rain surface and optional scrollable settings panel with immediate updates
  - id: tuning
    kind: library
    summary: Normalize finite saved values before rendering and persist explicit edits.
    operations:
    - name: RainSettings.tuning/RainTuning.normalized
      inputs:
      - name: values
        type: grid, density, motion, appearance, repertoire and clock settings
      outputs:
      - name: value
        type: normalized RainTuning; persisted TV preference keys
  outbound: []
constraints:
- id: grid_and_motion
  level: MUST
  statement: Automatic grid uses72 rows and aspect-based columns; manual columns clamp to24...240. Density spans0...1, speed0.25...3, fade1...16 glyphs. Share MatrixSimulation with macOS, including stationary cells, captured tail lifetimes, optional acceleration -120...0 glyph/s² and a positive terminal-speed floor. Search is a minimum simultaneous fraction of visible live cells, not new searches per second. Its range is0...1; setting zero does not stop the writing-head cycle.
- id: head_and_pulse
  level: MUST
  statement: Use headGlyph and headIntensity from the shared simulation. A head is not suppressed by a packet gap or random ink darkness. Apply shared GlyphPulse real-time gain to ordinary ink and halo intensity before pale-head mixing, independently of rain speed. Pulse0 disables gain; it does not change alpha, glyph identity, search quota or expiry. Never reveal a zero-opacity cell through the TV full-density floor.
- id: appearance
  level: MUST
  statement: Provide brightness spread and pulse0...1, glow0...3 and three normalized sRGB channels. Convert stored sRGB to linear light for the sRGB drawable. Glow0 emits no halo instances. Ordinary rain without the clock uses full TV exposure; with the clock, its mask boosts whole-glyph ink while halos remain at background exposure. This is feature parity, not pixel-identical output or desktop activity simulation.
- id: resources
  level: MUST
  statement: Discover restored private-use scalars from the bundled DreamsMatrix font, excluding designed Latin/Cyrillic. Classic mode uses the same Matrix-Code repertoire as macOS. Retain TV horizontal mirror variants and size the atlas for the selected repertoire. Prepare a replacement atlas before adoption; restarting the TV grid on repertoire change avoids obsolete indices. Bundle both fonts and third-party notices. Missing Metal/font/shader resources stop rendering with a visible localized failure route to settings.
- id: persistent_tuning
  level: MUST
  statement: Preserve existing TV preference keys and TV defaults (manual96 columns, density0.82, brightness0.18 and clock on). New appearance/motion defaults come from shared DreamsPreset except the explicitly requested AppleTV5,3 Glow-zero hardware default. Normalize out-of-range and nonfinite numeric values. Reset persists all TV defaults after confirmation. TV state does not mutate desktop preferences.
- id: remote_settings
  level: MUST
  statement: Use a scrollable system List, native Toggles and focusable native Button adjustment rows (Slider is unavailable on tvOS). Horizontal focus movement from directional presses or touch-surface swipes adjusts numeric values; vertical focus navigation remains native. Select increments. Ignore adjustment events while reset confirmation is presented. Expose localized names, values, adjustment hints and accessibility adjustment actions. Opening settings requests focus on Automatic columns. Present a centered settings panel with internal spacing and a rounded system-material background. Show rain, Back or PlayPause closes settings. PlayPause opens settings from rain; the separate Live preview toggle pauses/resumes rendering while the menu is open. Confirmation cancellation must not reset preferences.
- id: clock
  level: MUST
  statement: Preserve an optional HH:mm whole-glyph brightness mask, three typefaces, size0.5...1.15 and bounded floating drift. Cache the mask by minute, font, size and aspect. Drift changes sample coordinates, not grid positions. Clock off bypasses mask exposure and presents a rain accessibility label without a time value.
- id: lifecycle
  level: MUST
  statement: Own one renderer/simulation in the app's root. Preview settings edits reuse it without scaling the full-screen surface down. Render only in an active scene, respecting settings preview pause. Disable the idle timer only on the active rain page; restore it in settings, on inactivity and disappearance. Reset frame timing on resume, and pause/remove the Metal delegate and renderer on teardown. Settings must receive focus/input rather than the background rain.
- id: paused_preview
  level: MUST
  statement: With Live preview off in an active settings scene, coalesce tuning edits into one requested Metal frame without continuous animation. Focus-only updates must not request frames. Retain simulation time and wall-time appearance phase for nonstructural edits; resume excludes paused wall time. Grid/font edits rebuild with the renderer's stable seed and a bounded two-to-eight-second sample so the still is populated. Suppress FPS sampling/overlay on a requested paused frame. An inactive scene permits no drawing.
- id: a8_glow_default
  level: MUST
  statement: On AppleTV5,3 (A8), new preferences and reset use Glow zero. Preserve any existing saved Glow value and allow manual enabling. Other and unknown hardware retain the shared default; this changes a default, not the glow algorithm or a performance guarantee.
- id: fps
  level: MUST
  statement: Expose an optional default-off FPS toggle in Advanced. Use dreams.rain.fps with successful GPU completion timestamps, persistent preferences and reset-off semantics. Keep clock and rain behavior independent of the diagnostic readout.
- id: platform_boundary
  level: MUST
  statement: The TV target imports shared simulation, pulse, preset and shader sources through target membership without a dependency on the macOS executable, agent integration or desktop window lifecycle. macOS execution evidence does not establish TV behavior. Preserve EN/RU resources and the TV deployment target18.
- id: store_packaging
  level: MUST
  statement: Generate the tvOS-only application from project.yml with Bundle ID ru.egormerkushev.dreams.tv, team P8T2366K8X, automatic signing and TV version/build numbers independent of the desktop VERSION. Bundle the TV layered icon, App Store icon, standard/wide Top Shelf art and privacy manifest declaring own-app UserDefaults reason CA92.1, no tracking and no collected data. App Store export options produce a local artifact without uploading it or rewriting version/build. The new identifier owns a separate sandbox and does not import the previous developer app's preferences. Packaging does not establish font redistribution rights, physical-device quality, App Store processing or review acceptance.
effects:
  sideEffects:
  - id: preferences
    kind: state_mutation
    summary: Explicit edits/reset write the TV app's UserDefaults.
  - id: rendering
    kind: state_mutation
    summary: Render local Metal frames and manage the foreground application's idle timer.
evidence:
- id: store_target_validation
  kind: test
  path: validation/2026-10-25-store-target/README.md
  supports:
  - constraints.store_packaging
  - constraints.platform_boundary
- id: paused_preview_validation
  kind: test
  path: validation/2026-10-24-paused-preview/README.md
  supports:
  - constraints.paused_preview
  - constraints.a8_glow_default
- id: validation
  kind: test
  path: validation/2026-10-21-focus-input/README.md
  supports:
  - constraints
provenance:
  sourceConfidence:
    intent: high
    extraction: high
    behavior: medium
  notes:
  - User explicitly confirmed TV rain/settings parity with macOS, keeping the TV clock and excluding agent integrations and desktop-window functions.
  - Existing TV density/exposure/default grid and mirrored glyphs are compatibility choices; full-density tail and clock exposure remain TV-specific.
  - This is a newly recovered descriptive draft. Structural checks, renderer-instance tests, simulator input and physical-device acceptance are separate evidence levels.
