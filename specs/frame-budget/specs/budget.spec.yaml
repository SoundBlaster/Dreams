apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.rain.frame_budget
  title: RainFrameBudget
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Spend display refresh only where Glow does not already dominate frame cost, and skip halo work that cannot change pixels.
scope:
  boundedContext: rain_rendering_cost
  includes:
  - Requested MTKView frame rate on macOS rain/preview/probe renderers and the tvOS renderer.
  - CPU halo instance submission and the diffuse halo fragment path shared through Rain.metal.
  excludes:
  - Glow appearance, core glyph shading, simulation timing, settings UI, FPS readout semantics, thermal budgets and physical Apple TV acceptance.
provides:
  capabilities:
  - id: dreams.rain.frame_budget
    role: primary
    summary: Glow-dependent preferredFramesPerSecond and an invisible-halo coverage floor.
requires:
  capabilities:
  - id: platform.apple.metal_renderer
    summary: MTKView preferredFramesPerSecond, NSScreen/UIScreen maximumFramesPerSecond and instanced Metal halo draws.
interfaces:
  inbound:
  - id: glow_and_screen
    kind: library
    summary: Current Glow tuning and the hosting window's screen.
    operations:
    - name: RainFrameBudget.framesPerSecond
      inputs:
      - name: glow
        type: Double, 0...3
      - name: screenMaximum
        type: Int; 0 when the view has no window/screen
      - name: lowPower
        type: Bool; system Low Power Mode state
      outputs:
      - name: framesPerSecond
        type: 30 in Low Power Mode, with Glow above zero, or with an unknown screen; otherwise min(screen maximum, 120)
  outbound:
  - id: renderer_requests
    kind: library
    summary: Renderers set MTKView.preferredFramesPerSecond and omit halos below the shared floor.
constraints:
- id: glow_frame_rate
  level: MUST
  statement: In Low Power Mode, or with Glow above zero (or a non-finite value), request 30 fps. Otherwise with Glow exactly zero request the hosting screen's maximumFramesPerSecond, capped at 120. A view without a window/screen requests 30. macOS applies the policy at construction, on every Glow change and on the next draw after its window screen or system power mode changes. tvOS evaluates the system power mode, normalized tuning and window scene screen on each drawn frame. After Low Power Mode ends the original Glow and screen policy resumes. Simulation, pulse and wall-clock behavior stay time-based; a higher rate changes cadence, not motion speed. Offline posed PNG renders are unaffected.
- id: invisible_halo_floor
  level: MUST
  statement: The shared floor is 1/16384 halo coverage (RainFrameBudget.minimumHaloAlpha, mirrored literally in matrixFragment). The diffuse fragment returns zero before evaluating light clouds when sampled atlas alpha times instance alpha is below the floor. macOS and tvOS do not submit a halo instance whose alpha is below the floor; because atlas alpha never exceeds one, every fragment of such an instance would return zero, so CPU culling adds no further visual change. The floor keeps a skipped contribution below half an sRGB step at black for halo colors up to 2.6. Glow zero still emits no halos. Do not substitute the coarser 1/512 floor, which measurably darkened near-black skirts.
evidence:
- id: validation
  kind: test
  path: validation/2026-11-03/README.md
  supports:
  - constraints.glow_frame_rate
  - constraints.invisible_halo_floor
- id: low_power_validation
  kind: test
  path: validation/2026-11-03-low-power/README.md
  supports:
  - constraints.glow_frame_rate
provenance:
  sourceConfidence:
    intent: high
    extraction: high
    behavior: medium
  notes:
  - Owner-requested performance change (first performance PR). The 30 fps glow budget, the 120 fps cap and visual equivalence were requested; the 1/16384 floor is an implementation choice bracketed by offscreen pixel comparisons. Descriptive draft; windowed macOS probe measurements are not fullscreen, multi-display, power or tvOS device acceptance.
