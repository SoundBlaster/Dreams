provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: medium
  notes:
  - User requested opt-in braking and clarified that entry speed stays unchanged and only negative acceleration
    is adjustable.
  - The 20-percent terminal speed is an explicit implementation assumption to prevent stalled rain; it is not a
    user-specified number.
  - Descriptive draft; runtime checks and formal acceptance are separate. Source identities and run evidence are
    linked from README.md.
  - Search occupancy changes mutation selection and separates its PRNG from writing. The earlier legacy-parity witness
    remains historical; the current opt_in claim compares disabled and zero braking at the same search policy.
  - Current FSD/P2 scheduler baseline 98fe537f30ef5c2f31cd7c0b22ff4ba20e82175f; cached occupancy and timestamp queues
    preserve burst outcomes. Historical evidence is not reused as a new run. See validation/2026-10-14-search-fsd/README.md.
