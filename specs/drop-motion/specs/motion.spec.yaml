apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.rain.drop_motion
  title: DropMotion
  version: 0.1.0-draft.2
  status: draft
intent:
  summary: Let new rain heads enter at their existing speed and decelerate while their fixed glyph trails fade in
    order.
scope:
  boundedContext: rain_simulation
  includes:
  - Per-packet head timing, tail lifetime, event duration, saved macOS controls and renderer propagation.
  excludes:
  - Glyph geometry, shader glow/alpha, clock masks, capture status, display selection, hooks and tvOS adoption.
provides:
  capabilities:
  - id: dreams.rain.drop_motion
    role: primary
    summary: Optional constant negative acceleration followed by a positive terminal speed.
requires:
  capabilities:
  - id: platform.apple.windowserver
    summary: Native macOS settings integration requires AppKit/WindowServer; the simulation core itself performs
      no OS I/O.
  - id: platform.apple.metal_renderer
    summary: Preview/live adoption needs the existing Metal renderer; analytic simulation tests do not require a
      GPU.
interfaces:
  inbound:
  - id: tuning
    kind: library
    summary: Existing simulation/renderer boundary with an opt-in Deceleration value.
    operations:
    - name: init/setDeceleration
      inputs:
      - name: tuning
        type: enabled Boolean and acceleration in glyph rows per simulation second squared
      outputs:
      - name: effect
        type: captured by each new packet at row zero; existing packet motion and glyph lifetimes remain fixed
    - name: trigger/advance
      inputs:
      - name: observation
        type: event column/start time or monotonically increasing simulation timestamp
      outputs:
      - name: result
        type: conservative event duration or deterministic fixed-cell writes and dissolutions
  outbound: []
constraints:
- id: opt_in
  level: MUST
  statement: Default braking to disabled. Disabled tuning and zero acceleration use the same constant-speed writing
    schedule and glyph lifetimes under the selected search policy; do not change the existing speed control or add
    a second entry-speed control. Search occupancy independently replaces the former opportunistic mutation policy,
    so historical whole-state random-sequence parity is not a current guarantee.
- id: kinematics
  level: MUST
  statement: At each packet start, retain the existing randomized column entry speed V. Apply the configured negative
    acceleration until speed reaches 20 percent of V, then continue at that positive speed. Do not reverse or permanently
    stop the head. A new pass enters at V again.
- id: units_and_validation
  level: MUST
  statement: Acceleration is in glyph rows per simulation second squared, bounded to -120 through 0; default -12.
    Nonfinite values fall back to -12 and positive values clamp to zero. The existing speed multiplier S scales
    simulation time; at constant S, real-time entry speed is S times V and acceleration is S squared times a.
- id: deterministic_timing
  level: MUST
  statement: Compute row arrival times analytically and process writes/mutations in timestamp order. Different frame
    subdivisions at fixed tuning and full coverage must reach identical simulation state.
- id: tail_lifecycle
  level: MUST
  statement: Glyph cells stay in place. Each captures its own hold/fade lifetime when written; the rear follows
    the slower sequential dissolution schedule. Within one packet, fade starts and expiry times increase from top
    to bottom. Expired ink remains absent until a new writing pass owns that cell. At full density/coverage and
    unattenuated visibility, repeated active passes have no empty cells after a full-density pass fills them.
- id: stable_packet
  level: MUST
  statement: Capture motion tuning at row zero. Changing the option or acceleration affects subsequent packets,
    including new event packets, without retiming already written glyphs or jumping the current head.
- id: bounded_event
  level: MUST
  statement: With tuning/density applied before trigger and kept through its initial advance, the returned duration
    bounds the final glyph expiry including the slower rear. Do not remove an event stream when only its head has
    left the screen.
- id: parent_assembly
  level: MUST
  statement: Propagate saved enabled/acceleration values from controller to new and live renderers, and through
    both preview and live draw paths into simulation before trigger/advance. Keep mutation/activity clock handling
    and existing global speed scaling. Reset restores disabled and -12. The GUI exposes one option and one negative
    acceleration control; terminal speed is fixed rather than separately adjustable.
effects:
  sideEffects:
  - id: simulation_state
    kind: state_mutation
    summary: Updates per-column schedules, stationary cells and lifetimes; the core simulation performs no I/O.
  - id: preferences
    kind: state_mutation
    summary: The macOS controller persists rainDecelerationEnabled and rainDeceleration; MCP reports them read-only.
