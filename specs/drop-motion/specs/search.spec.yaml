provenance:
  sourceConfidence:
    intent: high
    boundary: medium
    behavior: medium
  notes:
  - 'User explicitly corrected starts per second to a minimum simultaneous share: at least 10 percent in search
    state.'
  - Default 10 percent, rounding upward, 0–100 range and inclusion of fading/head cells are explicit implementation
    choices.
  - Descriptive draft; test execution and structural validity are distinct from formal acceptance.
  - Current FSD/P2 scheduler baseline 98fe537f30ef5c2f31cd7c0b22ff4ba20e82175f; cached occupancy and timestamp queues
    preserve burst outcomes. Historical evidence is not reused as a new run. See validation/2026-10-14-search-fsd/README.md.
