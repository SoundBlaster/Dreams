apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.rain.search_occupancy
  title: GlyphSearch
  version: 0.1.0-draft.1
  status: draft
intent:
  summary: Let users control the share of visible glyphs simultaneously trying combinations.
scope:
  boundedContext: rain_simulation
  includes:
  - Simultaneous live-cell quota, burst lifetime, saved macOS control and renderer adoption.
  excludes:
  - Motion law, glyph outlines, shader glow/alpha, clocks, agent activity acquisition and tvOS adoption.
provides:
  capabilities:
  - id: dreams.rain.search_occupancy
    role: primary
    summary: Maintain a configurable simultaneous search share across all live glyph cells.
requires:
  capabilities:
  - id: platform.apple.windowserver
    summary: Native settings use AppKit; pure simulation tests do not require WindowServer.
  - id: platform.apple.metal_renderer
    summary: Preview/live renderer adoption requires the existing Metal renderer.
interfaces:
  inbound:
  - id: search_tuning
    kind: library
    summary: Simulation tuning and deterministic advance.
    operations:
    - name: setSearchFraction/advance
      inputs:
      - name: fraction_and_time
        type: Double fraction in 0...1; finite nondecreasing simulation time
      outputs:
      - name: search_state
        type: Per-position bursts with ceil(N * fraction) active positions after advance when glyphCount >= 2
  outbound: []
constraints:
- id: simultaneous_share
  level: MUST
  statement: At every completed advance with at least two available glyph designs, support ceil(N * fraction) simultaneous
    search positions, where N is all live non-gap cells in unhidden columns, including fading cells and heads. An
    empty screen has zero searches. Count cells across the whole grid, not columns or starts per second.
- id: tuning
  level: MUST
  statement: Default fraction is 0.1; finite values clamp to 0 through 1, nonfinite model updates are ignored. Zero
    cancels every search; one keeps every live cell searching. Changes apply on the next advance, including an advance
    at the current timestamp.
- id: burst
  level: MUST
  statement: Each chosen position rapidly changes designs through a finite burst, then settles to its selected target.
    Refill the occupancy quota as bursts complete; at saturation a position may immediately enter another burst.
    The existing mutation/activity rate affects trial cadence, not the configured simultaneous share.
- id: ink_lifetime
  level: MUST
  statement: 'Search changes glyph identity and mutation timestamps only: retain writtenAt, hold/fade, ink, warmth
    and flashedAt. Settling adds no brightness flash. Expiry, overwrite or hidden-column clearing removes that search;
    no mutation can resurrect expired ink.'
- id: independent_motion
  level: MUST
  statement: Changing the search fraction must not change the writing PRNG, packet timing, head motion or captured
    cell lifetimes. For fixed tuning and full coverage, global timestamp scheduling must produce the same state
    under fine and coarse frame subdivision.
- id: parent_assembly
  level: MUST
  statement: The macOS controller persists rainSearchFraction, exposes it read-only in MCP status, and propagates
    it to newly created and existing renderers. Both live and preview paths set the simulation fraction before triggers/advance.
    Settings show a 0–100 percent slider, and preset reset restores 10 percent.
effects:
  sideEffects:
  - id: search_state
    kind: state_mutation
    summary: Mutates glyph identities and search schedules; core has no external I/O.
  - id: search_preference
    kind: state_mutation
    summary: Persists rainSearchFraction in macOS defaults.
