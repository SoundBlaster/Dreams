apiVersion: specpm.dev/v0.1
kind: SpecPackage
metadata:
  id: dreams.drop_motion
  name: Dreams rain motion and appearance
  version: 0.4.0-draft.2
  summary: Stationary fading rain with optional deceleration, simultaneous search,
    pale heads and independent brightness pulses.
  license: MIT
  authors:
  - name: Dreams contributors (AI-assisted implementation and recovery)
specs:
- path: specs/motion.spec.yaml
- path: specs/search.spec.yaml
- path: specs/head.spec.yaml
- path: specs/pulse.spec.yaml
index:
  provides:
    capabilities:
    - dreams.rain.drop_motion
    - dreams.rain.search_occupancy
    - dreams.rain.head_visibility
    - dreams.rain.glyph_pulse
  requires:
    capabilities:
    - platform.apple.windowserver
    - platform.apple.metal_renderer
compatibility:
  platforms:
  - macos
  languages:
  - name: swift
keywords:
- digital-rain
- deceleration
- descriptive-draft
foreignArtifacts:
- format: markdown
  path: README.md
  role: documentation
