apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.overlay.exit
  title: ExitInput
  version: 0.1.0-draft.2
  status: draft
intent:
  summary: Route local opaque-window exits and a fallible global shortcut to stop the complete owned rain session.
scope:
  boundedContext: macos_overlay_session
  includes:
  - Esc/cancel routing, per-display exit button, visibility policy, shortcut recording and Carbon registration.
  excludes:
  - A global plain-Esc handler, guaranteed shortcut registration/rollback, key delivery while another app owns focus,
    screen lock or secrecy.
provides:
  capabilities:
  - id: dreams.overlay.exit
    role: primary
    summary: Route local opaque-window exits and a fallible global shortcut to stop the complete owned rain session.
requires:
  capabilities:
  - id: platform.apple.windowserver
    summary: Current responder/key-window event delivery, pointer tracking and accessibility state.
  - id: platform.apple.carbon_hotkeys
    summary: OS hotkey registration/dispatch can fail or conflict.
interfaces:
  inbound:
  - id: exit_entry
    kind: library
    summary: Existing internal MainActor boundary; no new public Swift API is asserted.
    operations:
    - name: local_exit
      inputs:
      - name: event
        type: opaque panel Esc (keyCode 53), cancelOperation or exit button action
      outputs:
      - name: callback
        type: onEscape/onExit routed by parent to session.stop
    - name: register/change
      inputs:
      - name: shortcut
        type: StopHotkey; default Ctrl+Option+Command+D
      outputs:
      - name: result
        type: registration success Boolean; old registration restoration attempted on failure
  outbound: []
constraints:
- id: local_escape
  level: MUST
  statement: Opaque overlay keyDown/cancelOperation invokes the local escape callback. Parent handleEscape stops
    only when background is opaque. The settings window uses the same callback; another app receiving Esc is outside
    this route.
- id: all_displays
  level: MUST
  statement: Parent wires Escape and Exit-button callbacks to the session-level stop operation, so an exit from
    one owned overlay closes all session overlays. Clicking the rain outside the Exit button only reveals controls/focuses
    the window.
- id: button_visibility
  level: MUST
  statement: Opaque content initially reveals the accessible dreams.exit-overlay button. Movement/entry/exit reveal
    it and renew a four-second hide deadline. Hide only when the deadline elapsed, tracked pointerOverButton is
    false, the button is not first responder, VoiceOver is off and Full Keyboard Access is off. The tracked flag
    starts false, mouseMoved updates it from the event position and mouseExited clears it; window attachment and
    mouseEntered reveal the control without initializing the flag from the current cursor position. A stationary
    cursor already over the button at presentation therefore does not prevent timed hiding.
- id: transparent_escape
  level: MUST
  statement: Transparent content has no exit button and does not take keyboard/mouse input; parent ignores handleEscape
    in this profile. Use the registered global hotkey, explicit Stop or agent stop to end the session.
- id: hotkey_recording
  level: MUST
  statement: Interactive shortcut recording accepts only combinations including Control, Option or Command and rejects
    Escape as a proposed shortcut. Native and legacy settings share one temporary recorder scoped to its initiating window;
    unrelated-window keys pass through. During recording, Escape cancels and is consumed before the window exit route.
    Second activation, native section change, window close/key loss, app deactivation/hide and cleanup cancel capture.
    Successful registration updates existing preferences and UI; failure leaves the saved value and shows an error.
    This is not an unconditional rain-exit or Carbon rollback guarantee.
- id: registration_failure
  level: MUST
  statement: Treat Carbon registration as fallible. Initial install reports failure. A settings retry after failed installation reinstalls both the handler and registration. Shortcut change with an existing registration unregisters
    the current registration, tries the new one and, on failure, attempts to register the previous one; do not promise
    that rollback cannot fail.
- id: callback_lifetime
  level: MUST
  statement: Keep the controller alive for the unretained Carbon handler context until registration is removed.
    Delegate termination calls settings cleanup to uninstall the handler/hotkey and clean up the controller; callbacks dispatch stop on
    MainActor.
effects:
  sideEffects:
  - id: input_registration
    kind: state_mutation
    summary: Registers/unregisters Carbon hotkeys and a temporary app-local recording monitor; does not register
      global plain Escape.
  - id: control_timers
    kind: state_mutation
    summary: Updates per-window tracking/accessibility/button state and four-second timers.
