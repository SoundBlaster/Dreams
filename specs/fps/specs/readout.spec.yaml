    - evidence/2026-10-24-fps-grid/source/Sources/Dreams/features/rain/ui/FPSOverlay.swift
    - evidence/2026-10-24-fps-grid/source/Sources/Dreams/features/rain/ui/RainRenderer.swift
    - evidence/2026-10-25-glyph-spacing/source/tvOS/Sources/features/matrix/ui/MatrixRenderer.swift
    - evidence/2026-10-25-glyph-spacing/source/Tests/DreamsTests/PresentedFPSTests.swift
