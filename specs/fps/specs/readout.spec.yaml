apiVersion: specpm.dev/v0.1
kind: BoundarySpec
metadata:
  id: dreams.rain.fps
  title: OptionalFrameCadenceReadout
  version: 0.1.0-draft.6
  status: draft
intent:
  summary: Let viewers inspect rain cadence without an external debugger.
scope:
  boundedContext: rain_diagnostics
  includes:
  - Per-renderer cadence sampling, Dreams digit atlas, Metal overlay and persistent opt-in controls.
  excludes:
  - Benchmark acceptance, frame-time percentiles, system-wide FPS and performance optimizations.
provides:
  capabilities:
  - id: dreams.rain.fps
    role: primary
    summary: Optional right-aligned FPS digits in reserved cells of the rain grid.
requires:
  capabilities:
  - id: platform.apple.metal_renderer
    summary: Render the overlay in the existing rain pass and observe completion or presentation callbacks.
interfaces:
  inbound:
  - id: setting
    kind: ui
    summary: Localized native Advanced toggle controls the per-app saved FPS preference.
    operations:
    - name: Show FPS
      inputs:
      - name: enabled
        type: Boolean, default false
      outputs:
      - name: readout
        type: Optional numeric Metal overlay after one full sampling window
  - id: timestamps
    kind: library
    summary: Renderer callbacks report observed successful frame timestamps to a synchronized window.
  outbound:
  - id: metal_overlay
    kind: library
    summary: Encode Dreams digits into the existing drawable render pass without changing rain scale.
effects:
  sideEffects:
  - id: preferences
    kind: state_mutation
    summary: Persist explicit toggle edits and reset to default off.
constraints:
- id: opt_in
  level: MUST
  statement: Default off. Native macOS Advanced and tvOS Advanced expose localized toggles and explanations. Persist independently per app; reset turns the readout off. Disabled rendering installs no FPS callbacks and lazily allocates no FPS atlas or pipeline.
- id: cadence
  level: MUST
  statement: Measure timestamp intervals independently for each renderer. macOS uses successful drawable presentation timestamps; tvOS uses successful command-buffer GPU completion timestamps because the TV SDK does not expose drawable presentation callbacks. Do not substitute CPU draw-call frequency. Round intervals per elapsed second to an integer and update only after a window of at least one second. Reject zero, non-finite and non-increasing timestamps. No number is shown until a full window is available.
- id: lifetime
  level: MUST
  statement: Reset the sampling window when toggling or resuming the TV renderer or settings preview. Reject callbacks from earlier generations. Requested paused TV stills exclude FPS callbacks and readout. Keep state synchronized across Metal callback threads and the main renderer. A disabled readout is absent immediately; retained atlas resources can be reused on re-enable.
- id: appearance
  level: MUST
  statement: Use unmirrored DreamsMatrix-Regular digits in three reserved rain cells, inset one complete row and column from the visible grid edge. Match the rain's quad size and spacing exactly; no independent pixel sizing, shadow or viewport. On TV, inherit the active atlas's common-body scale, keeping centers fixed and classic scale one. Skip the corresponding rain cores and halos without mutating simulation cells. Keep constant pale ink without pulse or mutation. Right-align up to three digits inside those cells. In a cropped macOS preview reserve cells relative to its visible full columns, below playback controls, while preserving production scale. A viewport narrower than five whole columns omits the counter. Offline PNGs omit it.
evidence:
- id: denser_tv_validation
  kind: test
  path: validation/2026-10-25-denser-glyphs.md
  supports:
  - constraints.appearance
- id: tv_body_spacing_validation
  kind: test
  path: validation/2026-10-25-glyph-spacing.md
  supports:
  - constraints.appearance
- id: grid_validation
  kind: test
  path: validation/2026-10-24-grid/README.md
  supports:
  - constraints.appearance
  - constraints.cadence
- id: paused_tv_validation
  kind: test
  path: validation/2026-10-24-paused-preview.md
  supports:
  - constraints.lifetime
- id: validation
  kind: test
  path: validation/2026-10-24/README.md
  supports:
  - constraints.cadence
  - constraints.opt_in
provenance:
  sourceConfidence:
    intent: high
    extraction: high
    behavior: medium
  notes:
  - Owner approved an optional in-glyph FPS counter for macOS and tvOS. TV completion semantics were disclosed during implementation. Descriptive draft; screenshots and structural validity do not establish physical FPS accuracy or negligible overhead.
