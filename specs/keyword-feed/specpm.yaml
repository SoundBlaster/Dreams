apiVersion: specpm.dev/v0.1
kind: SpecPackage
metadata:
  id: dreams.keyword_feed_reader
  name: Dreams shared feed reader
  version: 0.1.0-draft.1
  summary: Ready mailbox snapshots for macOS render consumers without frame-path mailbox I/O.
  license: MIT
  authors:
  - name: Dreams contributors
specs:
- path: specs/reader.spec.yaml
index:
  provides:
    capabilities:
    - dreams.feed.read
  requires:
    capabilities:
    - platform.apple.filesystem_observation
compatibility:
  platforms:
  - macos
  languages:
  - name: swift
foreignArtifacts:
- format: markdown
  path: README.md
  role: documentation
